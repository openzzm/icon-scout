<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Discover, preview, convert, and download website icons.">
    <meta name="theme-color" content="#10121a">
    <title>Icon Scout - Website Icon Finder</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Icon Scout home">
        <img class="brand-mark" src="/favicon.svg" alt="">
        <span>Icon Scout</span>
      </a>
      <span class="privacy-note">Public websites only</span>
    </header>

    <main>
      <section class="intro">
        <p class="section-label">Website icon finder</p>
        <h1>Find the icons a website actually uses</h1>
        <p class="intro-copy">Enter a URL to inspect favicons, Apple Touch Icons, and Web App Manifest assets, then get the strongest available version.</p>
        <form id="search-form" class="search-form">
          <label class="sr-only" for="website-url">Website URL</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10.5 13.5a4.24 4.24 0 0 0 6 0l2-2a4.24 4.24 0 0 0-6-6l-1.15 1.15m2.15 3.85a4.24 4.24 0 0 0-6 0l-2 2a4.24 4.24 0 0 0 6 6l1.15-1.15"/></svg>
            <input id="website-url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="For example: github.com" required>
          </div>
          <button class="primary-button" type="submit">
            <span class="button-label">Find website icons</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="results" class="results" hidden>
        <div class="result-heading">
          <div>
            <p class="section-label">Analysis results</p>
            <h2 id="site-title">Website icons</h2>
          </div>
          <a id="site-link" class="site-link" target="_blank" rel="noopener noreferrer"></a>
        </div>

        <article id="recommended" class="recommended"></article>

        <div class="all-heading">
          <h2>All candidates</h2>
          <span id="candidate-count"></span>
        </div>
        <div id="candidate-grid" class="candidate-grid"></div>
      </section>
    </main>

    <template id="recommended-template">
      <div class="recommended-preview preview-surface"><img alt=""></div>
      <div class="recommended-info">
        <span class="recommend-label">Recommended icon</span>
        <h3></h3>
        <p class="icon-url"></p>
        <dl class="meta-list"></dl>
        <div class="actions">
          <label class="format-control">Download format
            <select class="format-select" aria-label="Download format">
              <option value="original">Original format</option>
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
          </label>
          <a class="primary-button download-link">Download icon</a>
          <button class="secondary-button copy-button" type="button">Copy URL</button>
        </div>
      </div>
    </template>

    <template id="candidate-template">
      <article class="candidate">
        <div class="candidate-preview preview-surface"><img alt=""></div>
        <div class="candidate-body">
          <div class="candidate-top"><strong></strong><span></span></div>
          <p class="icon-url"></p>
          <div class="candidate-actions">
            <select class="format-select" aria-label="Download format">
              <option value="original">Original</option>
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
            <a class="download-link">Download</a>
            <button class="copy-button" type="button">Copy URL</button>
          </div>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
